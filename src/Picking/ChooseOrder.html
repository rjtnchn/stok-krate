<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WalangBrownout — Choose an Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0E1620;
  --card:#FFFFFF;
  --accent-cool:#3FC7B8; --accent-cool-dim:#2A9C90;
  --accent-warm:#F2A65A;
  --text-onLight:#16212B; --text-onLight-muted:#6B7A88;
  --border-light:#E1DCD1;
  --ok:#3FC7B8; --warn:#F2A65A; --crit:#E2695B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',sans-serif; background:#E8E4DB; color:var(--text-onLight); min-height:100vh; padding:32px;}
button{font-family:inherit; cursor:pointer;}

.frame{background:var(--card); max-width:1040px; margin:0 auto; border-radius:16px; box-shadow:0 20px 50px -18px rgba(20,25,30,0.25); overflow:hidden;}

/* header — matches Picking Floor / Receiving Dock frames */
.app-header{display:flex; align-items:center; gap:20px; padding:16px 28px; border-bottom:1px solid var(--border-light); background:var(--card);}
.logo-block{display:flex; align-items:center; gap:10px;}
.logo-mark{width:34px;height:34px;border-radius:8px; background:linear-gradient(135deg,var(--accent-cool),var(--accent-cool-dim)); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.logo-mark svg{width:18px;height:18px;}
.wordmark{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
.wordmark span{color:var(--accent-cool);}
.header-nav{display:flex; gap:26px; margin-left:8px;}
.header-nav a{font-size:12.5px; font-weight:500; color:var(--text-onLight-muted); text-decoration:none;}
.header-nav a.active{color:var(--text-onLight); font-weight:600;}
.header-search{flex:1; display:flex; justify-content:center;}
.search-box{display:flex; align-items:center; gap:8px; background:#F6F3EE; border:1px solid var(--border-light); border-radius:9px; padding:9px 14px; width:280px;}
.search-box svg{width:14px;height:14px; color:var(--text-onLight-muted); flex-shrink:0;}
.search-box input{border:none; outline:none; background:none; font-size:12.5px; width:100%;}
.header-right{display:flex; align-items:center; gap:16px;}
.cart-wrap{position:relative; color:var(--text-onLight-muted);}
.cart-wrap svg{width:19px;height:19px;}
.cart-badge{position:absolute; top:-7px; right:-8px; background:var(--crit); color:#fff; font-size:9px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.avatar{width:32px;height:32px;border-radius:50%; background:linear-gradient(135deg,var(--accent-warm),#d98a3a); display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:11px; color:#2b1a05;}

.body-pad{padding:26px 28px 34px;}
.role-tag{display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; color:var(--accent-cool-dim); background:rgba(63,199,184,0.10); border:1px solid rgba(63,199,184,0.3); padding:4px 10px; border-radius:14px; margin-bottom:12px;}

.topline{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
h1.page-title{font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:600; margin:0 0 4px 0;}
p.page-sub{margin:0; font-size:12.8px; color:var(--text-onLight-muted);}
.queue-count{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--accent-cool-dim); background:rgba(63,199,184,0.10); border:1px solid rgba(63,199,184,0.28); padding:6px 12px; border-radius:20px;}

.filter-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.chip-row{display:flex; gap:8px;}
.chip{border:1px solid var(--border-light); background:#FBF9F5; border-radius:20px; padding:7px 15px; font-size:11.8px; font-weight:500; color:var(--text-onLight-muted);}
.chip.active{background:var(--text-onLight); color:#fff; border-color:var(--text-onLight);}
.order-search{display:flex; align-items:center; gap:8px; background:#F6F3EE; border:1px solid var(--border-light); border-radius:9px; padding:9px 14px; width:230px;}
.order-search svg{width:14px;height:14px; color:var(--text-onLight-muted); flex-shrink:0;}
.order-search input{border:none; outline:none; background:none; font-size:12.5px; width:100%;}

/* order cards */
.order-card{display:flex; align-items:center; gap:18px; border:1px solid var(--border-light); border-radius:13px; padding:16px 18px; margin-bottom:12px; transition:box-shadow .15s ease, border-color .15s ease;}
.order-card:hover{box-shadow:0 6px 18px -8px rgba(20,25,30,0.15); border-color:#CFC8B9;}
.order-card.started{opacity:0.5;}
.priority-bar{width:4px; align-self:stretch; border-radius:3px; flex-shrink:0;}
.priority-bar.high{background:var(--crit);}
.priority-bar.med{background:var(--accent-warm);}
.priority-bar.low{background:var(--accent-cool);}
.order-id-block{width:110px; flex-shrink:0;}
.order-id{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;}
.order-time{font-size:10.8px; color:var(--text-onLight-muted); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
.order-customer{flex:1; min-width:140px;}
.order-customer .name{font-weight:600; font-size:13px;}
.order-customer .addr{font-size:11px; color:var(--text-onLight-muted); margin-top:2px;}
.order-items-preview{flex:1.4; display:flex; gap:8px; flex-wrap:wrap; min-width:180px;}
.item-chip{display:flex; align-items:center; gap:6px; background:#F6F3EE; border:1px solid var(--border-light); border-radius:16px; padding:5px 10px 5px 6px; font-size:11px;}
.item-chip .ic{width:20px;height:20px;border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px;}
.order-meta{width:110px; flex-shrink:0; text-align:center;}
.order-meta .lines{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px;}
.order-meta .lbl{font-size:10px; color:var(--text-onLight-muted); text-transform:uppercase; letter-spacing:0.04em; font-family:'IBM Plex Mono',monospace;}
.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:20px; font-size:10.5px; font-weight:600; white-space:nowrap;}
.badge.high{background:rgba(226,105,91,0.14); color:#b8392c;}
.badge.med{background:rgba(242,166,90,0.18); color:#a15f18;}
.badge.low{background:rgba(63,199,184,0.13); color:var(--accent-cool-dim);}
.start-btn{background:var(--text-onLight); color:#fff; border:none; border-radius:9px; padding:11px 18px; font-weight:600; font-size:12px; display:flex; align-items:center; gap:7px; flex-shrink:0; white-space:nowrap;}
.start-btn:hover{background:#000;}
.start-btn svg{width:13px;height:13px;}
.start-btn.done{background:rgba(63,199,184,0.15); color:var(--accent-cool-dim);}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-onLight-muted); font-size:13px;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-deep); color:#EAF1F5; padding:11px 18px; border-radius:10px; font-size:12.5px; display:flex; align-items:center; gap:9px; box-shadow:0 12px 32px -10px rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:.25s; z-index:100;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast svg{width:15px;height:15px; color:var(--accent-cool); flex-shrink:0;}

@media (max-width:800px){
  .header-nav, .header-search{display:none;}
  .order-card{flex-wrap:wrap;}
  .order-items-preview{order:5; flex-basis:100%;}
}
</style>
</head>
<body>

<div class="frame">
  <div class="app-header">
    <div class="logo-block">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 7v10l8 5 8-5V7l-8-5z" stroke="#04211D" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9v6M9 12h6" stroke="#04211D" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div class="wordmark">Walang<span>Brownout</span></div>
    </div>
    <div class="header-nav">
      <a class="active">Picking</a>
      <a>Receiving</a>
      <a>Orders</a>
    </div>
    <div class="header-search">
      <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input placeholder="Search products..."></div>
    </div>
    <div class="header-right">
      <div class="cart-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg><span class="cart-badge">1</span></div>
      <div class="avatar">AC</div>
    </div>
  </div>

  <div class="body-pad">
    <div class="role-tag">ROLE — STAFF · WAREHOUSE PICKER</div>

    <div class="topline">
      <div>
        <h1 class="page-title">Choose an Order to Pick</h1>
        <p class="page-sub">Orders are queued oldest-first within each priority tier</p>
      </div>
      <div class="queue-count" id="queueCount">5 orders in queue</div>
    </div>

    <div class="filter-row">
      <div class="chip-row" id="filterChips">
        <div class="chip active" data-filter="all">All</div>
        <div class="chip" data-filter="high">High priority</div>
        <div class="chip" data-filter="med">Medium</div>
        <div class="chip" data-filter="low">Low</div>
      </div>
      <div class="order-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="orderSearch" placeholder="Search order # or customer..."></div>
    </div>

    <div id="orderList"></div>
  </div>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><span id="toastMsg"></span></div>

<script>
const orders = [
  {id:'ORD-123', time:'9:02 AM', customer:'Maria Lopez', addr:'Lipa City, Batangas', priority:'high',
    items:[{name:'Thermostat V2', icon:'🌡️', bg:'#EFEAFB'}], lines:1, started:false},
  {id:'ORD-124', time:'9:15 AM', customer:'Dan Cruz', addr:'San Pablo, Laguna', priority:'high',
    items:[{name:'AC 1.5T', icon:'❄️', bg:'#E4F5F2'},{name:'Filter', icon:'🧯', bg:'#FCEFE2'}], lines:2, started:false},
  {id:'ORD-125', time:'9:41 AM', customer:'Grace Tan', addr:'Batangas City', priority:'med',
    items:[{name:'Air Purifier', icon:'🌬️', bg:'#EAF4FF'}], lines:1, started:false},
  {id:'ORD-126', time:'10:05 AM', customer:'Paolo Reyes', addr:'Tanauan, Batangas', priority:'med',
    items:[{name:'AC 2.0T', icon:'❄️', bg:'#E4F5F2'},{name:'Thermostat V1', icon:'🌡️', bg:'#EFEAFB'}], lines:2, started:false},
  {id:'ORD-127', time:'10:30 AM', customer:'Liza Gomez', addr:'Lipa City, Batangas', priority:'low',
    items:[{name:'Filter x2', icon:'🧯', bg:'#FCEFE2'}], lines:1, started:false},
];

let activeFilter = 'all';
let searchTerm = '';

function priorityLabel(p){ return p==='high' ? 'High priority' : p==='med' ? 'Medium' : 'Low priority'; }

function renderOrders(){
  const list = document.getElementById('orderList');
  const filtered = orders.filter(o =>
    (activeFilter==='all' || o.priority===activeFilter) &&
    (o.id.toLowerCase().includes(searchTerm) || o.customer.toLowerCase().includes(searchTerm))
  );
  document.getElementById('queueCount').textContent = `${orders.filter(o=>!o.started).length} orders in queue`;

  if (filtered.length === 0){
    list.innerHTML = '<div class="empty-state">No orders match this filter.</div>';
    return;
  }

  list.innerHTML = filtered.map(o => `
    <div class="order-card ${o.started ? 'started' : ''}">
      <div class="priority-bar ${o.priority}"></div>
      <div class="order-id-block">
        <div class="order-id">${o.id}</div>
        <div class="order-time">${o.time}</div>
      </div>
      <div class="order-customer">
        <div class="name">${o.customer}</div>
        <div class="addr">${o.addr}</div>
      </div>
      <div class="order-items-preview">
        ${o.items.map(it => `<div class="item-chip"><span class="ic" style="background:${it.bg};">${it.icon}</span>${it.name}</div>`).join('')}
      </div>
      <div class="order-meta">
        <div class="lines">${o.lines}</div>
        <div class="lbl">line item${o.lines>1?'s':''}</div>
      </div>
      <span class="badge ${o.priority}">${priorityLabel(o.priority)}</span>
      <button class="start-btn ${o.started?'done':''}" ${o.started?'disabled':''} onclick="startPicking('${o.id}')">
        ${o.started ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> In progress`
        : `Start picking <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`}
      </button>
    </div>`).join('');
}
renderOrders();

document.querySelectorAll('#filterChips .chip').forEach(chip => chip.addEventListener('click', () => {
  document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  renderOrders();
}));
document.getElementById('orderSearch').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase();
  renderOrders();
});

const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toastMsg');
function showToast(msg){ toastMsg.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2400); }

function startPicking(id){
  const order = orders.find(o => o.id === id);
  order.started = true;
  renderOrders();
  showToast(`Opening pick list for ${id} — items sorted oldest lot first.`);
}
</script>

</body>
</html>
